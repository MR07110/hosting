<style>
  :root{
    --canvas-default:#0d1117;
    --canvas-subtle:#161b22;
    --canvas-inset:#010409;
    --fg-default:#e6edf3;
    --fg-muted:#8b949e;
    --fg-subtle:#6e7681;
    --border-default:#30363d;
    --border-muted:#21262d;
    --accent-fg:#3fb950;
    --accent-emphasis:#3fb950;
    --accent-subtle:rgba(63,185,80,.15);
    --success-fg:#3fb950;
    --success-emphasis:#238636;
    --success-subtle:rgba(46,160,67,.15);
    --danger-fg:#f85149;
    --danger-emphasis:#da3633;
    --danger-subtle:rgba(248,81,73,.15);
    --attention-fg:#d29922;
    --attention-subtle:rgba(187,128,9,.15);
    --btn-bg:#21262d;
    --btn-border:#30363d;
    --btn-hover-bg:#30363d;
    --btn-hover-border:#8b949e;
    --btn-primary-bg:#238636;
    --btn-primary-hover:#2ea043;
    --btn-primary-border:rgba(240,246,252,.1);
    --header-bg:#010409;
    --header-text:#e6edf3;
    --header-border:#21262d;
    --header-muted:#8b949e;
    --shadow-sm:0 0 transparent;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
  }
  *{box-sizing:border-box;}
  html, body{overflow-x:hidden; width:100%;}
  body{
    margin:0; min-height:100vh;
    background:var(--canvas-subtle);
    color:var(--fg-default); font-family:var(--sans); font-size:14px; line-height:1.5;
  }
  ::selection{background:#3fb95055;}
  a{color:var(--accent-fg); text-decoration:none;}
  a:hover{text-decoration:underline;}
  code, .mono{font-family:var(--mono);}

  header{
    display:flex; align-items:center; justify-content:space-between;
    padding:0 24px; height:62px; background:var(--header-bg); width:100%;
    position:sticky; top:0; z-index:20; border-bottom:1px solid var(--header-border);
  }
  .logo{display:flex; align-items:center; gap:8px; font-weight:600; font-size:16px; color:var(--header-text); min-width:0;}
  .logo .dot{width:30px;height:30px;display:flex; align-items:center; justify-content:center; flex-shrink:0;}
  .logo .dot svg{display:block;}
  .logo small{font-family:var(--sans); font-weight:400; color:var(--header-muted); font-size:13px; margin-left:2px;}
  .headright{display:flex; align-items:center; gap:16px; min-width:0;}
  .user-badge{font-size:13px; color:var(--header-text); display:flex; align-items:center; gap:8px; padding:4px 8px 4px 4px; border-radius:6px; min-width:0; overflow:hidden;}
  .user-badge:hover{background:rgba(255,255,255,.08);}
  .user-badge .av{width:24px;height:24px;border-radius:50%;background:#30363d; border:1px solid rgba(255,255,255,.15); display:flex; align-items:center; justify-content:center; font-size:11px; color:#fff; font-weight:700;}

  main{max-width:820px; margin:0 auto; padding:32px 24px 100px;}

  .hero{margin-bottom:24px; padding-bottom:20px; border-bottom:1px solid var(--border-muted);}
  .eyebrow{color:var(--fg-muted); font-size:12px; letter-spacing:.02em; text-transform:uppercase; margin-bottom:10px; display:flex; align-items:center; gap:8px; font-weight:600;}
  .eyebrow::before{content:'●'; color:var(--success-emphasis); font-size:8px;}
  h1{font-size:24px; line-height:1.3; letter-spacing:-.01em; margin:0 0 8px; max-width:640px; font-weight:600; color:var(--fg-default);}
  h1 em{font-style:normal; color:var(--accent-fg);}
  .sub{color:var(--fg-muted); font-size:14px; max-width:560px; line-height:1.6;}

  .panel{
    background:var(--canvas-default); border:1px solid var(--border-default); border-radius:6px;
    padding:16px; margin-bottom:16px; box-shadow:var(--shadow-sm);
  }
  .panel h2{font-size:14px; color:var(--fg-default); margin:0 0 14px; font-weight:600; padding-bottom:10px; border-bottom:1px solid var(--border-muted);}

  .row{display:flex; gap:14px; flex-wrap:wrap;}
  .field{flex:1; min-width:180px; display:flex; flex-direction:column; gap:6px;}
  .field label{font-size:12px; color:var(--fg-default); font-weight:600;}
  .field .prefix-input{display:flex; align-items:center; background:var(--canvas-default); border:1px solid var(--border-default); border-radius:6px; overflow:hidden; box-shadow:var(--shadow-sm);}
  .field .prefix-input:has(input:focus){border-color:var(--accent-fg); box-shadow:0 0 0 3px var(--accent-subtle);}
  .field .prefix-input span{padding:0 10px; color:var(--fg-muted); font-family:var(--mono); font-size:13px; background:var(--canvas-subtle); border-right:1px solid var(--border-default); white-space:nowrap; align-self:stretch; display:flex; align-items:center;}
  input[type=text], input[type=email], input[type=password]{
    background:var(--canvas-default); border:1px solid var(--border-default); color:var(--fg-default);
    padding:7px 12px; border-radius:6px; font-family:var(--sans); font-size:14px; width:100%;
    outline:none; transition:border-color .1s, box-shadow .1s; box-shadow:var(--shadow-sm);
  }
  .field .prefix-input input{border:none; border-radius:0; box-shadow:none;}
  input:focus{border-color:var(--accent-fg); box-shadow:0 0 0 3px var(--accent-subtle);}

  .url-preview{font-family:var(--mono); font-size:12.5px; color:var(--fg-muted); margin-top:10px; word-break:break-all;}
  .url-preview .path{color:var(--accent-fg); font-weight:600;}

  .dropzone{
    border:2px dashed var(--border-default); border-radius:6px; padding:40px 20px; background:var(--canvas-subtle);
    text-align:center; cursor:default; transition:.12s; position:relative; overflow:hidden;
  }
  .dropzone.drag{border-color:var(--accent-fg); background:var(--accent-subtle);}
  .dropzone .icon{font-size:26px; margin-bottom:10px; color:var(--fg-subtle);}
  .dropzone .main-txt{font-weight:600; margin-bottom:4px; color:var(--fg-default); font-size:14px;}
  .dropzone .sub-txt{color:var(--fg-muted); font-size:12.5px; margin-bottom:16px;}
  .dropzone .pick-actions{display:flex; gap:8px; justify-content:center; flex-wrap:wrap;}
  .dropzone .pick-actions button{font-size:13px; padding:5px 14px;}
  .dropzone input{display:none;}

  .filelist{margin-top:14px; display:flex; flex-direction:column; border:1px solid var(--border-muted); border-radius:6px; overflow:hidden;}
  .file-row{
    display:flex; align-items:center; gap:12px; background:var(--canvas-default);
    padding:8px 12px; font-size:13px; border-bottom:1px solid var(--border-muted); min-width:0;
  }
  .file-row:last-child{border-bottom:none;}
  .file-row:hover{background:var(--canvas-subtle);}
  .file-row .fname{flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-family:var(--mono); color:var(--fg-default);}
  .file-row .fname::before{content:'📄'; margin-right:8px; font-size:12px;}
  .file-row .fsize{color:var(--fg-muted); font-size:12px; font-family:var(--mono);}
  .file-row .fstatus{font-size:12px; min-width:84px; text-align:right; font-weight:600;}
  .file-row .bar{height:4px; background:var(--border-muted); border-radius:2px; overflow:hidden; width:60px;}
  .file-row .bar > div{height:100%; background:var(--success-emphasis); width:0%; transition:width .2s;}
  .st-wait{color:var(--fg-subtle);}
  .st-up{color:var(--attention-fg);}
  .st-done{color:var(--success-fg);}
  .st-err{color:var(--danger-fg);}

  button{
    font-family:var(--sans); font-weight:500; font-size:14px; border-radius:6px; border:1px solid var(--btn-border);
    padding:5px 16px; cursor:pointer; transition:.08s; background:var(--btn-bg); color:var(--fg-default);
    box-shadow:var(--shadow-sm); line-height:20px;
  }
  button:hover{background:var(--btn-hover-bg); border-color:var(--btn-hover-border);}
  .btn-primary{background:var(--btn-primary-bg); color:#fff; border-color:var(--btn-primary-border);}
  .btn-primary:hover{background:var(--btn-primary-hover);}
  .btn-primary:disabled{background:#94d3a2; border-color:transparent; cursor:not-allowed;}
  .btn-ghost{background:var(--btn-bg); color:var(--fg-default); border:1px solid var(--btn-border);}
  .btn-block{width:100%; padding:7px 16px;}
  .actions{display:flex; gap:8px; margin-top:16px; align-items:center; flex-wrap:wrap;}
  .hint{font-size:12px; color:var(--fg-muted);}
  .errtxt{font-size:12.5px; color:var(--danger-fg); min-height:16px; font-weight:500;}

  .sites{display:flex; flex-direction:column; min-width:0;}
  .site-card{
    display:flex; align-items:center; justify-content:space-between; gap:16px;
    padding:16px 4px; border-bottom:1px solid var(--border-muted); min-width:0;
  }
  .site-card > div{min-width:0; flex:1;}
  .site-card:last-child{border-bottom:none;}
  .site-card .name{font-weight:600; font-size:15px; color:var(--accent-fg); display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
  .site-card .name::before{content:'📁'; font-size:13px;}
  .site-card .name .badge{font-size:11px; font-weight:500; color:var(--fg-muted); border:1px solid var(--border-default); border-radius:999px; padding:1px 8px; margin-left:2px;}
  .site-card .url{font-family:var(--mono); font-size:12.5px; color:var(--fg-muted); margin-top:5px; word-break:break-all;}
  .site-card .meta{font-size:12px; color:var(--fg-subtle); margin-top:6px; display:flex; align-items:center; gap:6px;}
  .site-card .meta::before{content:'●'; font-size:8px; color:var(--success-emphasis);}
  .empty{color:var(--fg-muted); font-size:13px; text-align:center; padding:24px 0;}

  .toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px);
    background:var(--fg-default); color:#fff; padding:10px 18px; border-radius:6px;
    font-size:13px; opacity:0; transition:.2s; pointer-events:none; z-index:100;
    box-shadow:0 8px 24px rgba(140,149,159,.3); border:1px solid rgba(255,255,255,.1);
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
  .toast.err{background:var(--danger-subtle); color:var(--danger-fg); border-color:#ffc1bc;}
  .toast.ok{background:var(--success-subtle); color:var(--success-fg); border-color:#aceebb;}

  .auth-wrap{min-height:calc(100vh - 62px); display:flex; align-items:flex-start; justify-content:center; padding:60px 24px; background:var(--canvas-subtle);}
  .auth-card{width:100%; max-width:340px;}
  .auth-logo{display:flex; align-items:center; justify-content:center; gap:10px; font-weight:600; font-size:22px; margin-bottom:24px; color:var(--fg-default);}
  .tabs{display:flex; border-bottom:1px solid var(--border-muted); margin-bottom:20px; gap:4px;}
  .tab{flex:1; text-align:center; padding:8px 4px; cursor:pointer; font-size:13px; font-weight:600; color:var(--fg-muted); transition:.1s; border-bottom:2px solid transparent; margin-bottom:-1px;}
  .tab:hover{color:var(--fg-default);}
  .tab.active{color:var(--fg-default); border-bottom-color:var(--accent-fg);}
  .auth-field{margin-bottom:14px; display:flex; flex-direction:column; gap:6px;}
  .auth-field label{font-size:12px; color:var(--fg-default); font-weight:600;}

  /* ---- Mustaqil sayt ko'rinishi: hech qanday MRhosting xrom (bar, header) yo'q ---- */
  iframe#siteframe{position:fixed; inset:0; width:100vw; height:100vh; border:none; margin:0; padding:0; background:#fff; display:block;}
  .viewer-state{
    position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:12px; text-align:center; padding:0 20px; background:var(--canvas-subtle); z-index:10;
  }
  .viewer-state .code{font-family:var(--mono); font-size:52px; color:var(--fg-muted); font-weight:700;}
  .viewer-state p{color:var(--fg-muted); max-width:400px; font-size:14px;}

  @media (max-width: 640px){
    header{padding:0 14px; height:56px;}
    .logo{font-size:14px;}
    .logo small{display:none;}
    .headright{gap:8px;}
    .user-badge{font-size:11.5px;}
    .user-badge span:not(.av){display:none;}
    main{padding:20px 14px 70px;}
    .hero{margin-bottom:18px; padding-bottom:14px;}
    h1{font-size:20px; max-width:100%;}
    .sub{font-size:13px; max-width:100%;}
    .panel{padding:14px 12px; border-radius:6px;}
    .row{flex-direction:column; gap:12px;}
    .field{min-width:0;}
    .field .prefix-input span{font-size:11.5px; padding:0 8px;}
    .dropzone{padding:26px 12px;}
    .dropzone .pick-actions{flex-direction:column;}
    .dropzone .pick-actions button{width:100%;}
    .file-row{flex-wrap:wrap; gap:6px 10px;}
    .file-row .fname{flex-basis:100%; white-space:normal; word-break:break-all;}
    .file-row .bar{width:44px;}
    .actions{flex-direction:column; align-items:stretch;}
    .actions button{width:100%;}
    .hint{text-align:center;}
    .site-card{flex-direction:column; align-items:flex-start; gap:10px;}
    .site-card button{width:100%;}
    .url-preview{font-size:11.5px;}
    .auth-wrap{padding:28px 16px;}
    .auth-logo{font-size:18px;}
    .tabs .tab{font-size:12.5px; padding:8px 4px;}
    .viewer-state .code{font-size:38px;}
    .toast{left:16px; right:16px; transform:translateY(20px); width:auto;}
    .toast.show{transform:translateY(0);}
  }

  @media (min-width: 641px) and (max-width: 900px){
    main{max-width:100%; padding:28px 24px 90px;}
  }
</style>

// MRhosting o'zining boshlang'ich tab-nomi/ikonkasi — mustaqil sayt ko'rsatilgach,
// dashboardga qaytilganda shu qiymatlarga tiklanadi.
const DEFAULT_TITLE = document.title;
const DEFAULT_FAVICON = document.querySelector('link[rel="icon"]')?.getAttribute("href") || "";

// ---------- yordamchi funksiyalar ----------
function slugify(str){
  return (str||"").toLowerCase().trim()
    .replace(/[^a-z0-9\-_]+/g,"-")
    .replace(/-+/g,"-")
    .replace(/^-|-$/g,"");
}
function pathId(p){ return p.replace(/\//g,"__"); }
function siteId(user, project){ return `${slugify(user)}__${slugify(project)}`; }
function fmtSize(b){
  if(b<1024) return b+" B";
  if(b<1024*1024) return (b/1024).toFixed(1)+" KB";
  return (b/1024/1024).toFixed(2)+" MB";
}
function showToast(msg, type=""){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.className = "toast show " + type;
  clearTimeout(showToast._t);
  showToast._t = setTimeout(()=> t.className = "toast", 2600);
}
function guessType(name){
  const ext = name.split(".").pop().toLowerCase();
  const map = {html:"text",htm:"text",css:"text",js:"text",json:"text",svg:"text",txt:"text",md:"text"};
  return map[ext] || "binary";
}
function mimeOf(name){
  const ext = name.split(".").pop().toLowerCase();
  const map = {
    html:"text/html", htm:"text/html", css:"text/css", js:"application/javascript",
    json:"application/json", svg:"image/svg+xml", png:"image/png", jpg:"image/jpeg",
    jpeg:"image/jpeg", gif:"image/gif", webp:"image/webp", ico:"image/x-icon",
    woff:"font/woff", woff2:"font/woff2", txt:"text/plain"
  };
  return map[ext] || "application/octet-stream";
}
function authErrMsg(code){

// Mustaqil sayt ko'rsatilganda brauzer tab nomi/ikonkasini o'sha saytnikiga almashtiradi,
// dashboardga qaytilganda esa MRhosting'nikiga qaytaradi — xuddi alohida domen kabi.
function applyTabIdentity(html, files){
  const m = html.match(/<title[^>]*>([\s\S]*?)<\/title>/i);
  const title = m ? m[1].replace(/<[^>]*>/g,"").trim() : "";
  document.title = title || DEFAULT_TITLE;

  const favKey = Object.keys(files).find(p => /(^|\/)favicon\.(ico|png|svg)$/i.test(p));
  let link = document.querySelector('link[rel="icon"]');
  if(!link){ link = document.createElement("link"); link.rel = "icon"; document.head.appendChild(link); }
  link.href = favKey ? files[favKey].url : DEFAULT_FAVICON;
}
function resetTabIdentity(){
  document.title = DEFAULT_TITLE;
  const link = document.querySelector('link[rel="icon"]');
  if(link) link.href = DEFAULT_FAVICON;
}

// ---------- fayllarni yig'ish (drag&drop papkalar bilan) ----------
async function entriesFromDataTransfer(dt){
  const items = dt.items;
  const files = [];
  async function readEntry(entry, path){
    if(entry.isFile){
      await new Promise((res)=> entry.file(f=>{ f.__relpath = path + f.name; files.push(f); res(); }));
    } else if(entry.isDirectory){
      const reader = entry.createReader();
      const entries = await new Promise((res)=> {
        let all = [];
        function readBatch(){
          reader.readEntries(batch=>{
            if(batch.length===0){ res(all); return; }
            all = all.concat(batch);
            readBatch();
          });
        }
        readBatch();
      });
      for(const e of entries) await readEntry(e, path + entry.name + "/");
    }
  }
  const entries = [];
  for(let i=0;i<items.length;i++){
    const it = items[i].webkitGetAsEntry && items[i].webkitGetAsEntry();
    if(it) entries.push(it);
  }
  if(entries.length){
    for(const e of entries){
      // Agar tashlangan narsa papka bo'lsa, papka nomini yo'lga qo'shmaymiz —
      // ichidagi fayllar to'g'ridan-to'g'ri root-relative bo'ladi.
      if(e.isDirectory){
        const reader = e.createReader();
        const children = await new Promise((res)=> {
          let all = [];
          function readBatch(){
            reader.readEntries(batch=>{
              if(batch.length===0){ res(all); return; }
              all = all.concat(batch);
              readBatch();
            });
          }
          readBatch();
        });
        for(const c of children) await readEntry(c, "");
      } else {
        await readEntry(e, "");
      }
    }
  } else {
    for(const f of dt.files) { f.__relpath = f.name; files.push(f); }
  }
  return files;
}

// ---------- Ixtiyoriy erkin alias (domen.uz/xoxlagan-nom) ----------
async function claimAlias(aliasRaw, sid, username, project){
  const aSlug = slugify(aliasRaw);
  if(!aSlug) return null;
  const aRef = doc(db,"aliases",aSlug);
  const existing = await getDoc(aRef);
  if(existing.exists() && existing.data().siteId !== sid){
    throw new Error(`"${aSlug}" nomi band — boshqasini tanlang`);
  }
  await setDoc(aRef, {
    siteId: sid,
    username: slugify(username),
    project: slugify(project),
    updatedAt: serverTimestamp()
  });
  return aSlug;
}
async function getAliasDoc(aliasRaw){
  const snap = await getDoc(doc(db,"aliases",slugify(aliasRaw)));
  return snap.exists() ? snap.data() : null;
}

// ---------- Supabase Storage'ga faylni yuklash, Firestore'ga faqat metama'lumot yozish ----------
async function uploadOneFile(sid, file, onProgress){
  const relpath = (file.__relpath || file.name).replace(/^\/+/, "");
  const mime = mimeOf(relpath);
  const storagePath = `${sid}/${relpath}`;

  onProgress(15);
  const { error: upErr } = await supabase.storage
    .from(SUPABASE_BUCKET)
    .upload(storagePath, file, { upsert: true, contentType: mime, cacheControl: "3600" });
  if(upErr) throw new Error(upErr.message);
  onProgress(75);

  const { data: pub } = supabase.storage.from(SUPABASE_BUCKET).getPublicUrl(storagePath);

  const fileRef = doc(db, "sites", sid, "files", pathId(relpath));
  await setDoc(fileRef, {
    path: relpath,
    kind: guessType(relpath),
    mime,
    size: file.size,
    storagePath,
    url: pub.publicUrl,
    updatedAt: serverTimestamp()
  });
  onProgress(100);
}

// ---------- 100+ fayl yuklashda "qotib qolish"ni oldini olish ----------
// Muammoning sababi: avvalgi versiyada fayllar birma-bir, ketma-ket
// yuklangan va bironta so'rov tarmoqda "osilib qolsa" (javob kelmasa),
// undan keyingi HAMMA fayllar navbatda kutib qolar edi (brauzer hech qanday
// xato bermay, faqat juda uzoq default timeout kutar edi). Shu sababli:
//  1) Fayllar bir nechtasi PARALLEL yuklanadi (concurrency pool),
//  2) Har bir fayl uchun QATTIQ timeout qo'yiladi — vaqt tugasa, o'sha
//     faylgina "xato" deb belgilanadi va navbat davom etadi,
//  3) Timeoutdan keyin bir marta avtomatik qayta urinib ko'riladi.
const UPLOAD_CONCURRENCY = 5;      // bir vaqtda nechta fayl yuklanishi
const UPLOAD_TIMEOUT_MS = 25000;   // bitta fayl uchun maksimal kutish vaqti
const UPLOAD_MAX_RETRIES = 2;      // muvaffaqiyatsiz bo'lsa, necha marta qayta urinish

function withTimeout(promise, ms, label){
  let timer;
  const timeout = new Promise((_, reject)=>{
    timer = setTimeout(()=> reject(new Error(label || "vaqt tugadi (timeout)")), ms);
  });
  return Promise.race([promise, timeout]).finally(()=> clearTimeout(timer));
}

async function uploadOneFileWithRetry(sid, file, onProgress, onStatus){
  let lastErr;
  for(let attempt = 0; attempt <= UPLOAD_MAX_RETRIES; attempt++){
    if(attempt > 0 && onStatus) onStatus(`qayta (${attempt})`);
    try{
      await withTimeout(
        uploadOneFile(sid, file, onProgress),
        UPLOAD_TIMEOUT_MS,
        "vaqt tugadi — tarmoq javob bermadi"
      );
      return;
    }catch(err){
      lastErr = err;
      onProgress(0);
    }
  }
  throw lastErr;
}

// Cheklangan parallellik bilan ishlovchi oddiy pool: "concurrency" ta ish
// bir vaqtning o'zida boradi, biri tugashi bilan navbatdagisi boshlanadi.
function runPool(items, concurrency, worker){
  let idx = 0;
  let active = 0;
  return new Promise((resolve)=>{
    function launchNext(){
      if(idx >= items.length && active === 0){ resolve(); return; }
      while(active < concurrency && idx < items.length){
        const i = idx++;
        active++;
        Promise.resolve(worker(items[i], i)).finally(()=>{
          active--;
          launchNext();
        });
      }
    }
    launchNext();
  });
}

async function listMySites(username){

// ---------- index.html'ni Supabase'dan olib, ichidagi nisbiy yo'llarni public URL'ga almashtirish ----------
async function renderSiteHtml(files){
  const indexKey = Object.keys(files).find(p => p.toLowerCase() === "index.html")
    || Object.keys(files).find(p => p.toLowerCase().endsWith("/index.html"));
  if(!indexKey) return null;

  function resolve(basePath, ref){
    if(/^(https?:)?\/\//.test(ref) || ref.startsWith("data:")) return null;
    const baseDir = basePath.includes("/") ? basePath.slice(0, basePath.lastIndexOf("/")+1) : "";
    let combined = (baseDir + ref).split("/");
    const out = [];
    for(const seg of combined){
      if(seg === "." || seg === "") continue;
      if(seg === ".."){ out.pop(); continue; }
      out.push(seg);
    }
    return out.join("/");
  }

  const res = await fetch(files[indexKey].url, { cache: "no-store" });
  if(!res.ok) throw new Error("index.html yuklab bo'lmadi (HTTP " + res.status + ")");
  let html = await res.text();

  // Nisbiy src/href larni Supabase'dagi public URL'larga almashtiramiz —
  // brauzer keyin fayllarni to'g'ridan-to'g'ri CDN'dan, parallel yuklaydi.
  html = html.replace(/(src|href)=["']([^"':][^"']*)["']/gi, (m, attr, ref)=>{
    if(/^(https?:|data:|mailto:|tel:|#)/.test(ref)) return m;
    const key = resolve(indexKey, ref);
    if(key && files[key]) return `${attr}="${files[key].url}"`;
    return m;
  });

  // CSS ichidagi url(...) murojaatlarini ham almashtiramiz (masalan fon rasm)
  html = html.replace(/<style[^>]*>([\s\S]*?)<\/style>/gi, (m, css)=>{
    const newCss = css.replace(/url\((['"]?)([^'")]+)\1\)/gi, (mm, q, ref)=>{
      if(/^(https?:|data:)/.test(ref)) return mm;
      const key = resolve(indexKey, ref);
      if(key && files[key]) return `url(${q}${files[key].url}${q})`;
      return mm;
    });
    return m.replace(css, newCss);
  });

  return html;
}

// Marshrutlash endi #hash orqali emas, haqiqiy pathname orqali ishlaydi —

// noma'lum har qanday path shu index.html'ga qaytarilishi (SPA fallback)
// sozlangan bo'lishi kerak.
function route(){
  const path = location.pathname.replace(/^\/+|\/+$/g, "");
  if(path && path.toLowerCase() !== "index.html"){
    const parts = path.split("/").filter(Boolean);
    if(parts.length >= 2){ renderViewer(parts[0], parts[1]); return; }
    if(parts.length === 1){ renderViewerByAlias(parts[0]); return; }
  }
  resetTabIdentity();
  if(!authChecked){ renderBoot(); return; }
  if(!authUser){ renderAuth(); return; }
  if(!authUsername){ renderNeedUsername(); return; }
  renderDashboard();
}

      const row = rows[i];
      const status = row.querySelector(".fstatus");
      const bar = row.querySelector(".bar > div");
      status.textContent = "navbatda"; status.className = "fstatus st-up";
      try{
        await uploadOneFileWithRetry(
          sid, file,
          (pct)=>{ bar.style.width = pct+"%"; },
          (txt)=>{ status.textContent = txt; }
        );
        status.textContent = "tayyor"; status.className = "fstatus st-done";
        done++;
      }catch(err){
        status.textContent = "xato"; status.className = "fstatus st-err";
        failed++;
        showToast(`${file.__relpath}: ${err.message}`, "err");
      }
      updateHint();
    });
    if(done>0){
      await setDoc(doc(db,"sites",sid), { fileCount: done }, { merge:true });
      const msg = aliasSlug
        ? `Nashr qilindi: ${DOMAIN}/${authUsername}/${slugify(project)}  •  ${DOMAIN}/${aliasSlug}`
        : `Nashr qilindi: ${DOMAIN}/${authUsername}/${slugify(project)}`;
      showToast(msg, "ok");
      selectedFiles = []; renderFileList();
      aliasEl.value = ""; updateAliasPreview();
      aliasBox.style.display = "none"; aliasToggleWrap.style.display = "block";
      refreshSites();
    }
    publishBtn.disabled = false;
  });
}

// ---------- Ommaviy ko'rish sahifasi (mustaqil — hech qanday MRhosting xrom yo'q) ----------
function renderViewer(username, project){
  const sid = siteId(username, project);
  app.innerHTML = `<div id="viewerBody"></div>`;
  const body = document.getElementById("viewerBody");
  body.innerHTML = `<div class="viewer-state"><div class="code">···</div><p>Yuklanmoqda...</p></div>`;
  loadAndRenderSite(sid, body, "Bu manzilda sayt topilmadi.");
}

// ---------- Erkin alias orqali ko'rish sahifasi (domen.uz/xoxlagan-nom) ----------
function renderViewerByAlias(aliasSlug){
  const clean = slugify(aliasSlug);
  app.innerHTML = `<div id="viewerBody"></div>`;
  const body = document.getElementById("viewerBody");
  body.innerHTML = `<div class="viewer-state"><div class="code">···</div><p>Yuklanmoqda...</p></div>`;

  getAliasDoc(clean).then(a=>{
    if(!a){
      body.innerHTML = `<div class="viewer-state"><div class="code">404</div><p>"${clean}" nomida sayt topilmadi.</p></div>`;
      return;
    }
    loadAndRenderSite(a.siteId, body, "Bu saytning fayllari topilmadi.");
  }).catch(err=>{
    body.innerHTML = `<div class="viewer-state"><div class="code">!</div><p>Xatolik: ${err.message}. Firestore xavfsizlik qoidalarini tekshiring.</p></div>`;
  });
}

// Ikkalasi (username/project va alias) uchun umumiy: fayllar ro'yxatini o'qib, to'liq ekranga chizadi
function loadAndRenderSite(sid, body, notFoundMsg){
  loadSiteFiles(sid).then(async files=>{
    if(!Object.keys(files).length){
      body.innerHTML = `<div class="viewer-state"><div class="code">404</div><p>${notFoundMsg}</p></div>`;
      return;
    }
    let html;
    try{
      html = await renderSiteHtml(files);
    }catch(err){
      body.innerHTML = `<div class="viewer-state"><div class="code">!</div><p>Xatolik: ${err.message}</p></div>`;
      return;
    }
    if(!html){
      body.innerHTML = `<div class="viewer-state"><div class="code">?</div><p>index.html topilmadi. Loyiha to'liq yuklanmagan bo'lishi mumkin.</p></div>`;
      return;
    }
    applyTabIdentity(html, files);
    body.innerHTML = `<iframe id="siteframe" sandbox="allow-scripts allow-forms allow-popups allow-modals"></iframe>`;
    document.getElementById("siteframe").srcdoc = html;
  }).catch(err=>{
    body.innerHTML = `<div class="viewer-state"><div class="code">!</div><p>Xatolik: ${err.message}. Firestore xavfsizlik qoidalarini tekshiring.</p></div>`;
  });
}
